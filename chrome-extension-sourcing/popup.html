<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Sourcing • Importateur E-Commerce</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      width: 100%;
      min-width: 320px;
      max-width: 480px;
      background: #080D1A;
      margin: 0 auto;
      padding: 0;
    }

    body {
      width: 100%;
      min-width: 320px;
      max-width: 480px;
      min-height: 280px;
      background: #080D1A;
      color: #F8FAFC;
      padding: 0 12px 14px 12px;
      margin: 0 auto;
      overflow-x: hidden;
      overflow-y: auto;
      transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 🖐️ Poignée Tactile de Glissement / Déplacement */
    .drag-handle-container {
      width: 100%;
      padding: 8px 0 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .drag-handle-container:active {
      cursor: grabbing;
    }
    .drag-pill {
      width: 48px;
      height: 5px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .drag-handle-container:hover .drag-pill,
    .drag-handle-container:active .drag-pill {
      background: #38BDF8;
      width: 60px;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    
    /* Header */
    .header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 8px; 
      border-bottom: 1px solid #1E293B; 
      padding-bottom: 6px; 
    }
    .header-title { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .header-title h2 { 
      font-size: 13px; 
      font-weight: 800; 
      color: #38BDF8; 
      letter-spacing: 0.02em; 
    }
    .badge-platform { 
      background: rgba(56, 189, 248, 0.15); 
      border: 1px solid #0284C7; 
      color: #38BDF8; 
      font-size: 10px; 
      font-weight: 800; 
      padding: 2px 7px; 
      border-radius: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.03em; 
    }

    /* Mode Minimisé Toggle */
    .btn-minimize-toggle {
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 12px;
    }

    /* Media Preview Card (Photos uniquement) */
    .media-preview-container { 
      background: #0B1120; 
      border: 1.5px solid #1E293B; 
      border-radius: 10px; 
      padding: 8px 10px; 
      margin-bottom: 8px; 
      width: 100%; 
    }
    .section-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 6px; 
      font-size: 10.5px; 
      font-weight: 800; 
      color: #94A3B8; 
      text-transform: uppercase; 
      letter-spacing: 0.03em; 
    }

    /* Images Gallery */
    .images-preview-box { margin-bottom: 4px; width: 100%; }
    .images-header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-toggle-all { background: none; border: none; color: #38BDF8; font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: underline; }
    .images-scroll-grid { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; width: 100%; scrollbar-width: thin; scrollbar-color: #3B82F6 #0B1120; }
    .images-scroll-grid::-webkit-scrollbar { height: 4px; }
    .images-scroll-grid::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 4px; }
    
    .img-thumb-card { position: relative; width: 62px; height: 62px; min-width: 62px; border-radius: 6px; overflow: hidden; border: 2px solid #334155; cursor: pointer; background: #1E293B; transition: all 0.15s; flex-shrink: 0; }
    .img-thumb-card.selected { border-color: #10B981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .img-thumb-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-thumb-check { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; background: rgba(15, 23, 42, 0.85); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #10B981; font-weight: 900; }
    .img-thumb-card:not(.selected) .img-thumb-check { display: none; }
    .img-thumb-card:not(.selected) { opacity: 0.45; filter: grayscale(80%); }

    .btn-media-sub { flex: 1; padding: 7px 8px; font-size: 11px; font-weight: 800; border-radius: 6px; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-images-send { background: rgba(59, 130, 246, 0.15); border: 1.5px solid #3B82F6; color: #93C5FD; }
    .btn-images-send:hover { background: #3B82F6; color: #FFF; }

    /* Status Card (Product Specs) */
    .status-card { background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; font-size: 11.5px; width: 100%; }
    .preview-title { font-weight: 700; color: #FFFFFF; margin-bottom: 5px; line-height: 1.3; font-size: 11.5px; word-break: break-word; }
    .preview-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: #94A3B8; font-size: 11px; }
    .preview-val { color: #FCD34D; font-weight: 700; }
    .preview-sup { color: #60A5FA; font-weight: 700; word-break: break-word; }

    /* Mode Tabs */
    .mode-tabs { display: flex; gap: 6px; margin-bottom: 8px; width: 100%; }
    .mode-tab { flex: 1; padding: 7px 4px; background: #1E293B; border: 1px solid #334155; border-radius: 6px; color: #94A3B8; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
    .mode-tab.active { background: linear-gradient(135deg, #2563EB, #1D4ED8); border-color: #3B82F6; color: white; }

    .target-product-box { background: #1E293B; border: 1px solid #3B82F6; border-radius: 8px; padding: 8px; margin-bottom: 8px; display: none; width: 100%; }
    .target-product-label { font-size: 10.5px; font-weight: 700; color: #93C5FD; margin-bottom: 4px; display: block; }
    .target-product-select { width: 100%; background: #0B1120; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 11px; padding: 6px; outline: none; }

    /* Main Import Buttons */
    .btn-import { width: 100%; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white; border: none; border-radius: 8px; padding: 11px 12px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); margin-bottom: 6px; }
    .btn-import:hover, .btn-import:active { background: linear-gradient(135deg, #1D4ED8, #1E40AF); }
    .btn-import.btn-enrich { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
    .btn-import.btn-enrich:hover, .btn-import.btn-enrich:active { background: linear-gradient(135deg, #047857, #065F46); }

    .msg { margin-top: 6px; padding: 8px 10px; border-radius: 6px; font-size: 11px; display: none; line-height: 1.35; width: 100%; }
    .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10B981; color: #34D399; }
    .msg-error { background: rgba(244, 63, 94, 0.2); border: 1px solid #F43F5E; color: #FDA4AF; }
    
    /* État Réduit / Compact */
    body.is-compact .media-preview-container,
    body.is-compact .mode-tabs,
    body.is-compact .target-product-box,
    body.is-compact #previewTiersBox {
      display: none !important;
    }
  </style>
</head>
<body id="popupBody">
  <!-- 🖐️ Poignée Tactile de Glissement -->
  <div id="dragHandleBar" class="drag-handle-container" title="Glisser pour déplacer ou ajuster">
    <div class="drag-pill"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span style="font-size: 15px;">⚡</span>
      <h2>App Sourcing • Mobile</h2>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="platformBadge" class="badge-platform">Détection...</span>
      <button type="button" id="btnMinimizeToggle" class="btn-minimize-toggle" title="Agrandir / Réduire">↕</button>
    </div>
  </div>

  <!-- ZONE PRÉVISUALISATION DES PHOTOS DÉTECTÉES -->
  <div id="mediaContainer" class="media-preview-container">
    <div id="imagesPreviewBox" class="images-preview-box" style="display: none;">
      <div class="section-header">
        <span id="imagesCountBadge">📷 Photos HD Détectées (0)</span>
        <div class="images-header-actions">
          <button type="button" id="btnToggleAllImages" class="btn-toggle-all">Tout désélectionner</button>
        </div>
      </div>
      <div id="imagesGrid" class="images-scroll-grid">
        <!-- Vignettes générées dynamiquement en JS -->
      </div>
      <div style="margin-top: 6px; display: flex; gap: 6px;">
        <button type="button" id="btnSendImagesDirect" class="btn-media-sub btn-images-send" style="width: 100%;">
          <span id="btnSendImagesText">📷 Capter les Photos dans Magasin</span>
        </button>
      </div>
    </div>

    <div id="noMediaDetectedBox" style="font-size: 10px; color: #64748B; text-align: center; padding: 4px 0; display: none;">
      🔍 Analyse des photos du produit...
    </div>
  </div>

  <!-- Mode Selector -->
  <div class="mode-tabs">
    <button type="button" id="tabCreate" class="mode-tab active">📦 Nouvel Article</button>
    <button type="button" id="tabEnrich" class="mode-tab">🏭 Compléter Fiche</button>
  </div>

  <!-- Preview Card (Données Fiche Produit) -->
  <div class="status-card">
    <div id="previewTitle" class="preview-title">Détection du produit...</div>
    <div class="preview-row">
      <span>💰 Prix Estimé :</span>
      <span id="previewPrice" class="preview-val">Analyse...</span>
    </div>
    <div class="preview-row">
      <span>🏭 Fournisseur :</span>
      <span id="previewSupplier" class="preview-sup">Recherche...</span>
    </div>
    <div class="preview-row" id="previewLocationRow" style="display: none;">
      <span>📍 Origine :</span>
      <span id="previewLocation" style="color: #CBD5E1;">Chine</span>
    </div>
    
    <!-- Paliers MOQ & Tarification Dégressive -->
    <div id="previewTiersBox" style="margin-top: 6px; padding-top: 5px; border-top: 1px dashed rgba(255,255,255,0.15); display: none;">
      <div style="color: #93C5FD; font-weight: 800; font-size: 9.5px; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em;">
        📊 Paliers & MOQ Usine Détectés :
      </div>
      <div id="previewTiersList" style="display: flex; flex-direction: column; gap: 3px;"></div>
    </div>
  </div>

  <!-- Target Product Selection for Option B -->
  <div id="targetProductBox" class="target-product-box">
    <label class="target-product-label">🔗 Article Cible dans votre Application :</label>
    <select id="targetProductSelect" class="target-product-select">
      <option value="">Chargement des articles du catalogue...</option>
    </select>
  </div>

  <!-- Main Action Button -->
  <button id="btnImport" class="btn-import">
    <span id="btnImportText">📥 IMPORTER DANS LE SOURCING</span>
  </button>

  <div id="msgBox" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
