<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>App Sourcing 1-Clic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #080D1A; color: #F8FAFC; padding: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #1E293B; padding-bottom: 8px; }
    .header-title { display: flex; align-items: center; gap: 6px; }
    .header h2 { font-size: 13px; font-weight: 800; color: #38BDF8; letter-spacing: 0.02em; }
    .badge-live { background: rgba(16, 185, 129, 0.2); border: 1px solid #10B981; color: #34D399; font-size: 10px; font-weight: 800; padding: 2px 6px; borderRadius: 4px; }
    
    .status-card { background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 11.5px; }
    .preview-title { font-weight: 700; color: #FFFFFF; margin-bottom: 6px; line-height: 1.35; font-size: 12px; }
    .preview-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #94A3B8; font-size: 11px; }
    .preview-val { color: #FCD34D; font-weight: 700; }
    .preview-sup { color: #60A5FA; font-weight: 700; }

    .mode-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .mode-tab { flex: 1; padding: 7px 4px; background: #1E293B; border: 1px solid #334155; border-radius: 6px; color: #94A3B8; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
    .mode-tab.active { background: linear-gradient(135deg, #2563EB, #1D4ED8); border-color: #3B82F6; color: white; }

    .target-product-box { background: #1E293B; border: 1px solid #3B82F6; border-radius: 8px; padding: 8px; margin-bottom: 12px; display: none; }
    .target-product-label { font-size: 10.5px; font-weight: 700; color: #93C5FD; margin-bottom: 4px; display: block; }
    .target-product-select { width: 100%; background: #0B1120; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 11px; padding: 6px; outline: none; }

    .btn-import { width: 100%; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white; border: none; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    .btn-import:hover { background: linear-gradient(135deg, #1D4ED8, #1E40AF); }
    .btn-import.btn-enrich { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
    .btn-import.btn-enrich:hover { background: linear-gradient(135deg, #047857, #065F46); }

    .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 11px; display: none; line-height: 1.35; }
    .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10B981; color: #34D399; }
    .msg-error { background: rgba(244, 63, 94, 0.2); border: 1px solid #F43F5E; color: #FDA4AF; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span style="font-size: 16px;">⚡</span>
      <h2>App Sourcing • 1-Clic</h2>
    </div>
    <span class="badge-live">Alibaba & 1688</span>
  </div>

  <!-- Mode Selector -->
  <div class="mode-tabs">
    <button type="button" id="tabCreate" class="mode-tab active">📦 Nouvel Article</button>
    <button type="button" id="tabEnrich" class="mode-tab">🏭 Compléter Fiche</button>
  </div>

  <!-- Preview Card -->
  <div class="status-card">
    <div id="previewTitle" class="preview-title">Détection du produit...</div>
    <div class="preview-row">
      <span>💰 Prix Usine :</span>
      <span id="previewPrice" class="preview-val">Analyse...</span>
    </div>
    <div class="preview-row">
      <span>🏭 Fournisseur :</span>
      <span id="previewSupplier" class="preview-sup">Recherche...</span>
    </div>
    <div class="preview-row" id="previewLocationRow" style="display: none;">
      <span>📍 Origine :</span>
      <span id="previewLocation" style="color: #CBD5E1;">Chine</span>
    </div>
    
    <!-- Paliers MOQ & Tarification Dégressive -->
    <div id="previewTiersBox" style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.15); display: none;">
      <div style="color: #93C5FD; font-weight: 800; font-size: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em;">
        📊 Paliers & MOQ Usine Détectés :
      </div>
      <div id="previewTiersList" style="display: flex; flex-direction: column; gap: 3px;"></div>
    </div>
  </div>

  <!-- Target Product Selection for Option B -->
  <div id="targetProductBox" class="target-product-box">
    <label class="target-product-label">🔗 Article Cible dans votre Application :</label>
    <select id="targetProductSelect" class="target-product-select">
      <option value="">Chargement des articles de votre catalogue...</option>
    </select>
  </div>

  <!-- Main Action Button -->
  <button id="btnImport" class="btn-import">
    <span id="btnImportText">📥 IMPORTER COMME NOUVEL ARTICLE</span>
  </button>

  <div id="msgBox" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
